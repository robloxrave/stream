<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADHD RAVE (test)</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0e0b1a; color: #f2eefc;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  main { width: 100%; max-width: 420px; padding: 24px; text-align: center; }

  .poster {
    display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
    border-radius: 16px; margin: 0 0 18px; background: #1a1530;
  }

  /* Rainbow title: every letter cycles through the colours, each one slightly behind the one
     on its left, so the colours appear to flow from left to right. */
  h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: 0.06em; margin: 0 0 6px; }
  h1 .ch { display: inline-block; color: hsl(0 100% 62%); animation: rainbow 3s linear infinite; }
  @keyframes rainbow { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    h1 .ch { animation: none; filter: hue-rotate(calc(var(--i) * 40deg)); }
  }

  #status { margin: 0 0 6px; opacity: 0.8; }
  #transport { margin: 0 0 20px; min-height: 1.2em; font-size: 0.78rem; opacity: 0.65; }
  .label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.55; margin: 0; }
  #nowplaying { font-size: 1.15rem; margin: 4px 0 20px; word-break: break-word; }

  button {
    display: block; width: 100%; padding: 18px; margin: 12px 0; font-size: 1.1rem;
    border: 0; border-radius: 14px; color: #fff; background: #6c3df4;
  }
  button.secondary { background: #2a2442; }
  button.lang {
    position: fixed; top: 12px; right: 12px; width: auto; margin: 0;
    padding: 6px 12px; font-size: 0.8rem; border-radius: 999px; background: #2a2442; opacity: 0.85;
  }

  .lagbox { margin-top: 20px; text-align: left; }
  .lagrow { display: flex; justify-content: space-between; font-size: 0.85rem; opacity: 0.85; }
  .lagbar { height: 8px; border-radius: 4px; background: #2a2442; margin-top: 6px; overflow: hidden; }
  #lagFill { height: 100%; width: 0%; background: #6c3df4; transition: width 0.4s, background 0.4s; }
  .lagbox[data-state="good"] #lagFill { background: #3ddc84; }
  .lagbox[data-state="warn"] #lagFill { background: #f5b83d; }
  .lagbox[data-state="bad"]  #lagFill { background: #ff5c5c; }
  #lagHint { font-size: 0.78rem; opacity: 0.65; margin: 6px 0 0; min-height: 1em; }

  .how {
    margin-top: 24px; padding: 16px 16px 8px; border-radius: 14px; background: #17122b;
    text-align: left; font-size: 0.92rem; line-height: 1.65;
  }
  .how h2 { font-size: 1rem; margin: 0 0 8px; }
  .how ol { margin: 0; padding-left: 1.3em; }
  .how li { margin-bottom: 10px; }
</style>
</head>
<body>
<button id="lang" class="lang" type="button"></button>
<main>
  <img id="poster" class="poster" src="1792392198032.jpg" alt="" onerror="this.style.display='none'">
  <h1 id="title"></h1>
  <p id="status"></p>
  <p id="transport"></p>

  <p class="label" id="npLabel"></p>
  <p id="nowplaying">-</p>

  <button id="toggle" type="button"></button>
  <button id="resync" class="secondary" type="button"></button>

  <div class="lagbox" id="lagbox" data-state="">
    <div class="lagrow"><span id="lagLabel"></span><span id="lagText">-</span></div>
    <div class="lagbar"><div id="lagFill"></div></div>
    <p id="lagHint"></p>
  </div>

  <section class="how">
    <h2 id="howTitle"></h2>
    <ol id="steps"></ol>
  </section>

  <audio id="audio" preload="none"></audio>
</main>

<script>
// ---- Settings you may want to change -------------------------------------
const CONFIG = {
  streamUrl: 'https://robloxrave.duckdns.org/adhd', // your direct stream link
  title: 'ADHD RAVE',                                // big rainbow title (also used in the phone's media controls)
  defaultLanguage: 'ko',                             // 'ko' or 'en' (players can switch with the button in the corner)

  posterUrl: '1792392198032.jpg',  // square image in the same folder as this page; shown on the page and in the notification. '' for none.

  cacheBust: true,        // adds ?t=<time> on each connect so the browser never reuses an old connection
  retryDelayMs: 3000,     // wait this long before reconnecting after a dropout

  // Low-latency playback (WebRTC). Falls back to the normal stream if it can't connect.
  webrtc: {
    enabled: true,
    stunUrl: 'stun:stun.l.google.com:19302',  // helps the browser and the server find each other
    connectTimeoutMs: 8000,   // give up and use the normal stream after this long
    gatherTimeoutMs: 2000,    // the most time to spend collecting network addresses
    dropGraceMs: 5000,        // a short network blip can recover by itself; wait this long
    stallSeconds: 5           // no audio packets for this long means reconnect
  },

  // Automatic catch-up (gentle): only jumps to live if you stay far behind for a while.
  autoCatchUp: true,           // set to false to turn automatic catch-up off completely
  maxLagSeconds: 20,           // "far behind" means more than this many seconds
  lagSustainSeconds: 10,       // ...and it must stay that way for this many seconds in a row
  catchUpCooldownSeconds: 300,  // never auto-jump more than once per this many seconds

  // The "behind live" indicator colours
  lagGoodSeconds: 6,      // up to this: green
  lagWarnSeconds: 12,     // up to this: yellow, above: red

  // Now playing (the title the DJ sets in BUTT)
  nowPlayingUrl: '',      // leave empty to use <your server>/status-json.xsl
  nowPlayingPollMs: 10000
};

// ---- All the text on the page --------------------------------------------
const STRINGS = {
  ko: {
    stopped: '대기 중',
    connecting: '연결 중...',
    live: 'LIVE 재생 중',
    paused: '일시정지',
    buffering: '버퍼링 중...',
    reconnecting: '다시 연결하는 중...',
    tapToStart: '"▶️ 라이브 듣기"를 눌러 시작하세요',
    nowPlaying: 'DJ',
    offAir: '다음 DJ 준비 중',
    npUnavailable: '재생 정보를 불러오지 못했어요',
    npLive: 'LIVE',
    listen: '▶️ 라이브 듣기',
    play: '▶️ 재생',
    pause: '⏸ 일시정지',
    jump: '⏩ 라이브로 이동',
    lagLabel: '라이브와의 시간차 (대략)',
    lagPaused: '일시정지됨',
    lagMeasuring: '측정 중...',
    lagSeconds: s => '약 ' + s + '초',
    lagLow: '1초 미만',
    hintLow: '실시간에 가까워요',
    modeLow: '저지연 모드',
    modeStandard: '일반 모드',
    hintPaused: '⏩ 버튼을 누르면 라이브 위치로 돌아와요',
    hintGood: '실시간과 거의 같아요',
    hintWarn: '조금 뒤처졌어요',
    hintBad: '많이 뒤처졌어요! ⏩ 버튼을 눌러 새로고침 하세요',
    howTitle: '🎧 플레이어 사용법',
    steps: [
      '로블록스 게임 안의 라이브 DJ 사운드는 꺼 주세요.',
      '이 페이지에서 "▶️ 라이브 듣기"를 누른 뒤, 페이지는 그대로 두고 다시 로블록스를 켜세요. 고음질 라이브 DJ 사운드가 뒤에서 계속 재생될 것입니다!',
      '소리가 점점 늦어지는 것 같거나, 일시정지했다가 다시 들을 때는 "⏩ 라이브로 이동" 버튼을 눌러 가장 최신 위치로 새로고침 하세요. 알림창 플레이어의 ⏩ / ⏭️ 버튼으로도 할 수 있어요.'
    ],
    langButton: 'EN'
  },
  en: {
    stopped: 'Stopped',
    connecting: 'Connecting...',
    live: 'LIVE',
    paused: 'Paused',
    buffering: 'Buffering...',
    reconnecting: 'Reconnecting...',
    tapToStart: 'Tap "▶️ Listen live" to start',
    nowPlaying: 'DJ',
    offAir: 'Next DJ coming up',
    npUnavailable: 'Now playing unavailable',
    npLive: 'LIVE',
    listen: '▶️ Listen live',
    play: '▶️ Play',
    pause: '⏸ Pause',
    jump: '⏩ Jump to live',
    lagLabel: 'Behind live (approx.)',
    lagPaused: 'Paused',
    lagMeasuring: 'measuring...',
    lagSeconds: s => '~' + s + ' s',
    lagLow: 'under 1 s',
    hintLow: 'Close to real time',
    modeLow: 'Low latency',
    modeStandard: 'Standard',
    hintPaused: 'Press ⏩ to rejoin the live point',
    hintGood: 'In sync',
    hintWarn: 'A little behind',
    hintBad: 'Far behind! Press ⏩ to catch up',
    howTitle: '🎧 How to listen',
    steps: [
      'Turn off the live DJ audio inside Roblox.',
      'Press "▶️ Listen live" on this page, then switch to Roblox. The music keeps playing in the background.',
      'If the sound seems to fall behind, or after you pause, press ⏩ to jump to the latest moment! The ⏩ / ⏭️ button in your notification bar does the same.'
    ],
    langButton: '한국어'
  }
};
// ---------------------------------------------------------------------------

const audio = document.getElementById('audio');
const statusEl = document.getElementById('status');
const transportEl = document.getElementById('transport');
const toggleBtn = document.getElementById('toggle');
const resyncBtn = document.getElementById('resync');
const langBtn = document.getElementById('lang');
const npEl = document.getElementById('nowplaying');
const lagBox = document.getElementById('lagbox');
const lagText = document.getElementById('lagText');
const lagFill = document.getElementById('lagFill');
const lagHint = document.getElementById('lagHint');

// ---- Language ------------------------------------------------------------
function loadLang() {
  try {
    const saved = localStorage.getItem('lang');
    if (saved === 'ko' || saved === 'en') return saved;
  } catch (e) {}
  return CONFIG.defaultLanguage === 'en' ? 'en' : 'ko';
}
let lang = loadLang();
const t = key => STRINGS[lang][key];

// ---- Rainbow title -------------------------------------------------------
(function buildTitle() {
  const h1 = document.getElementById('title');
  h1.setAttribute('aria-label', CONFIG.title);
  const chars = Array.from(CONFIG.title);
  const cycle = 3;                 // seconds for one full colour cycle (matches the CSS)
  const step = 0.3;                // each letter is this many seconds behind its left neighbour
  chars.forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'ch';
    span.setAttribute('aria-hidden', 'true');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.setProperty('--i', i);
    span.style.animationDelay = '-' + (((chars.length - 1 - i) * step) % cycle).toFixed(2) + 's';
    h1.appendChild(span);
  });
})();

let started = false;          // the listener has pressed play at least once
let staleConnection = false;  // the connection dropped while paused; reconnect on next play
let retryTimer = null;
let lagStrikes = 0;
let lastAutoJump = 0;
let ignorePauseUntil = 0;     // our own reconnects can fire a spurious "pause" event
let statusKey = 'stopped';

// Test switches, for test.html only: ?test=icecast skips WebRTC, ?test=timeout makes it never connect.
const testMode = new URLSearchParams(location.search).get('test');
const webrtcSupported = typeof RTCPeerConnection !== 'undefined';

let transport = '';          // what is attached to the player: 'webrtc', 'icecast' or ''
let useIcecast = false;      // WebRTC failed, so stay on the normal stream for now
let connectId = 0;           // each connect gets a number, so old attempts can't interfere
let webrtcPc = null;
let webrtcTimer = null;      // connect timeout
let dropTimer = null;        // grace period after a network blip
let lastPackets = -1;
let stalledSeconds = 0;

function setStatus(key) { statusKey = key; statusEl.textContent = t(key); }

function showTransport() {
  if (transport === 'webrtc') transportEl.textContent = t('modeLow');
  else if (transport === 'icecast') transportEl.textContent = t('modeStandard');
  else transportEl.textContent = '';
}

function setMediaState(state) {
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = state;
}

function updateButtons() {
  if (!started) toggleBtn.textContent = t('listen');
  else toggleBtn.textContent = audio.paused ? t('play') : t('pause');
}

function liveUrl() {
  if (!CONFIG.cacheBust) return CONFIG.streamUrl;
  const sep = CONFIG.streamUrl.includes('?') ? '&' : '?';
  return CONFIG.streamUrl + sep + 't=' + Date.now();
}

// Open a fresh connection. A fresh connection starts at the live point.
function connect() {
  clearTimeout(retryTimer);
  const id = ++connectId;
  started = true;
  staleConnection = false;
  lagStrikes = 0;
  ignorePauseUntil = Date.now() + 1500;
  setStatus('connecting');
  closeWebRTC();
  transport = '';
  showTransport();
  const skipWebRTC = !CONFIG.webrtc.enabled || !webrtcSupported || useIcecast || testMode === 'icecast';
  if (skipWebRTC) connectIcecast();
  else connectWebRTC(id);
  updateButtons();
}

function startPlaying() {
  const p = audio.play();
  if (p && p.catch) {
    p.catch(err => {
      if (err && err.name === 'NotAllowedError') {
        setStatus('tapToStart');
        updateButtons();
      }
      // AbortError just means a newer connect() replaced this one; ignore it.
    });
  }
}

function connectIcecast() {
  transport = 'icecast';
  audio.srcObject = null;
  audio.src = liveUrl();
  audio.load();
  startPlaying();
}

// Detach the player first, so closing the connection can't look like a dropout.
function closeWebRTC() {
  clearTimeout(webrtcTimer);
  clearTimeout(dropTimer);
  lastPackets = -1;
  stalledSeconds = 0;
  if (!webrtcPc) return;
  audio.srcObject = null;
  webrtcPc.close();
  webrtcPc = null;
}

// Low-latency connection: the page and the server swap one offer and one answer over
// HTTPS, then the audio travels directly between them.
async function connectWebRTC(id) {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: CONFIG.webrtc.stunUrl }] });
  const stream = new MediaStream();
  let connected = false;
  webrtcPc = pc;
  transport = 'webrtc';

  // Start the player now, inside the click: browsers may refuse once we have waited.
  // The audio track joins this same stream when it arrives.
  audio.removeAttribute('src');
  audio.srcObject = stream;
  startPlaying();

  webrtcTimer = setTimeout(() => fallBackToIcecast(id), CONFIG.webrtc.connectTimeoutMs);
  pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.ontrack = event => stream.addTrack(event.track);
  pc.onconnectionstatechange = () => {
    if (id !== connectId) return;
    const state = pc.connectionState;
    if (state === 'connected') {
      connected = true;
      clearTimeout(webrtcTimer);
      clearTimeout(dropTimer);
    } else if (state === 'disconnected') {
      clearTimeout(dropTimer);
      dropTimer = setTimeout(() => { if (id === connectId) reconnectAfterDrop(); }, CONFIG.webrtc.dropGraceMs);
    } else if (state === 'failed') {
      if (connected) reconnectAfterDrop();
      else fallBackToIcecast(id);
    }
  };

  if (testMode === 'timeout') return;

  try {
    await pc.setLocalDescription(await pc.createOffer());
    await waitForAddresses(pc);
    if (id !== connectId) return;
    const res = await fetch(CONFIG.streamUrl + '/whep', {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const answer = await res.text();
    if (id !== connectId) return;
    await pc.setRemoteDescription({ type: 'answer', sdp: answer });
  } catch (err) {
    console.warn('WebRTC unavailable:', err);
    fallBackToIcecast(id);
  }
}

function waitForAddresses(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') { resolve(); return; }
    setTimeout(resolve, CONFIG.webrtc.gatherTimeoutMs);
    pc.addEventListener('icegatheringstatechange', () => {
      if (pc.iceGatheringState === 'complete') resolve();
    });
  });
}

function fallBackToIcecast(id) {
  if (id !== connectId) return;
  useIcecast = true;
  ignorePauseUntil = Date.now() + 1500;
  closeWebRTC();
  connectIcecast();
  updateButtons();
}

function reconnectAfterDrop() {
  setStatus('reconnecting');
  connect();
}

// A BUTT reconnect can leave the connection open but silent, so watch the packets arrive.
async function checkWebRTCFlow() {
  const pc = webrtcPc;
  if (!pc || pc.connectionState !== 'connected' || audio.paused) { stalledSeconds = 0; return; }
  const stats = await pc.getStats();
  if (pc !== webrtcPc) return;
  let packets = 0;
  stats.forEach(report => {
    if (report.type === 'inbound-rtp' && report.kind === 'audio') packets = report.packetsReceived;
  });
  stalledSeconds = packets === lastPackets ? stalledSeconds + 1 : 0;
  lastPackets = packets;
  if (stalledSeconds >= CONFIG.webrtc.stallSeconds) reconnectAfterDrop();
}
setInterval(checkWebRTCFlow, 1000);

// Normal resume after a pause: continue where it left off, unless the connection died meanwhile.
function resume() {
  if (staleConnection || (!audio.src && !audio.srcObject)) { connect(); return; }
  const p = audio.play();
  if (p && p.catch) p.catch(() => connect());
}

// Jump to live also gives WebRTC another chance.
function goLive() { useIcecast = false; connect(); }

toggleBtn.addEventListener('click', () => {
  if (!started) connect();
  else if (audio.paused) resume();
  else audio.pause();
});
resyncBtn.addEventListener('click', goLive);

audio.addEventListener('playing', () => { setStatus('live'); showTransport(); setMediaState('playing'); updateButtons(); });
audio.addEventListener('pause', () => {
  if (Date.now() < ignorePauseUntil) return;
  setStatus('paused'); setMediaState('paused'); updateButtons();
});
audio.addEventListener('waiting', () => { if (!audio.paused) setStatus('buffering'); });

// If the connection drops while playing, reconnect. If it drops while paused, wait for the next play.
function handleDrop() {
  if (!started || transport === 'webrtc') return;   // WebRTC watches its own connection
  if (audio.paused) { staleConnection = true; return; }
  setStatus('reconnecting');
  clearTimeout(retryTimer);
  useIcecast = false;   // the normal stream dropped too, so try WebRTC first next time
  retryTimer = setTimeout(connect, CONFIG.retryDelayMs);
}
audio.addEventListener('error', handleDrop);
audio.addEventListener('ended', handleDrop);

// ---- "Behind live" indicator + gentle auto catch-up ----------------------
// The browser tells us how much audio it has received but not yet played. Audio at the end of
// that queue is the newest audio the phone has, so the queue length is roughly how far behind
// live the playhead is. It leaves out the short trip from the DJ to the server (about 1-2 s).
function currentLag() {
  if (!audio.buffered.length) return null;
  return Math.max(0, audio.buffered.end(audio.buffered.length - 1) - audio.currentTime);
}

function showLag(text, width, state, hint) {
  lagText.textContent = text;
  lagFill.style.width = width + '%';
  lagBox.dataset.state = state;
  lagHint.textContent = hint;
}

function updateLagUI() {
  if (!started) { showLag('-', 0, '', ''); return null; }
  if (audio.paused) { showLag(t('lagPaused'), 0, 'paused', t('hintPaused')); return null; }
  if (transport === 'webrtc') { showLag(t('lagLow'), 5, 'good', t('hintLow')); return null; }
  const lag = currentLag();
  if (lag === null) { showLag(t('lagMeasuring'), 0, '', ''); return null; }
  const width = Math.min(100, (lag / (CONFIG.lagWarnSeconds * 2)) * 100);
  let state = 'good', hint = t('hintGood');
  if (lag > CONFIG.lagWarnSeconds) { state = 'bad'; hint = t('hintBad'); }
  else if (lag > CONFIG.lagGoodSeconds) { state = 'warn'; hint = t('hintWarn'); }
  showLag(t('lagSeconds')(lag.toFixed(0)), width, state, hint);
  return lag;
}

setInterval(() => {
  const lag = updateLagUI();
  if (!CONFIG.autoCatchUp || lag === null) { lagStrikes = 0; return; }
  if (lag > CONFIG.maxLagSeconds) lagStrikes++; else lagStrikes = 0;
  const cooledDown = Date.now() - lastAutoJump > CONFIG.catchUpCooldownSeconds * 1000;
  if (lagStrikes >= CONFIG.lagSustainSeconds && cooledDown) {
    lastAutoJump = Date.now();
    connect();
  }
}, 1000);

// ---- Now playing (title the DJ sets in BUTT) -----------------------------
const streamParsed = new URL(CONFIG.streamUrl);
const mountPath = streamParsed.pathname;
const nowPlayingUrl = CONFIG.nowPlayingUrl || (streamParsed.origin + '/status-json.xsl');
let npState = { mode: 'none', title: '' };   // mode: none | title | off | error
let currentMediaTitle = '';

// The poster doubles as the artwork in the phone's notification / lock-screen player.
function posterArtwork() {
  if (!CONFIG.posterUrl) return [];
  const src = new URL(CONFIG.posterUrl, location.href).href;
  const ext = src.split('?')[0].split('.').pop().toLowerCase();
  const type = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp' }[ext];
  const art = { src, sizes: '512x512' };
  if (type) art.type = type;
  return [art];
}

function makeMetadata(title, artist) {
  return new MediaMetadata({ title, artist, artwork: posterArtwork() });
}

function renderNowPlaying() {
  let text = '-';
  if (npState.mode === 'title') text = npState.title || t('npLive');
  else if (npState.mode === 'off') text = t('offAir');
  else if (npState.mode === 'error') text = t('npUnavailable');
  npEl.textContent = text;   // textContent, so a DJ's title can never inject code into the page
}

function updateMediaTitle(text) {
  if ('mediaSession' in navigator && text !== currentMediaTitle) {
    currentMediaTitle = text;
    navigator.mediaSession.metadata = makeMetadata(text, CONFIG.title);
  }
}

async function refreshNowPlaying() {
  try {
    const res = await fetch(nowPlayingUrl, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    let sources = (data && data.icestats && data.icestats.source) || [];
    if (!Array.isArray(sources)) sources = [sources];
    const mine = sources.find(s => s && s.mount === mountPath);
    if (mine) {
      npState = { mode: 'title', title: mine.title || '' };
      updateMediaTitle(mine.title || 'LIVE');
    } else {
      npState = { mode: 'off', title: '' };
    }
  } catch (err) {
    // Most likely the server does not allow this page to read it (CORS), or it is offline.
    console.warn('Now playing unavailable:', err);
    npState = { mode: 'error', title: '' };
  }
  renderNowPlaying();
}
refreshNowPlaying();
setInterval(refreshNowPlaying, CONFIG.nowPlayingPollMs);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshNowPlaying(); });

// ---- Phone / lock-screen / notification controls -------------------------
// Pages cannot add custom buttons, but we can reassign the standard ones.
if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = makeMetadata(CONFIG.title, 'LIVE');
  const setAction = (name, fn) => { try { navigator.mediaSession.setActionHandler(name, fn); } catch (e) {} };
  setAction('play', () => { started ? resume() : connect(); });
  setAction('pause', () => audio.pause());
  setAction('nexttrack', goLive);    // "Next" button = jump to live
  setAction('seekforward', goLive);  // "Forward" button = jump to live (shown on some phones)
}

// ---- Apply the chosen language to everything on the page -----------------
function applyLanguage() {
  document.documentElement.lang = lang;
  document.getElementById('npLabel').textContent = t('nowPlaying');
  resyncBtn.textContent = t('jump');
  document.getElementById('lagLabel').textContent = t('lagLabel');
  document.getElementById('howTitle').textContent = t('howTitle');
  const list = document.getElementById('steps');
  list.textContent = '';
  t('steps').forEach(text => {
    const li = document.createElement('li');
    li.textContent = text;
    list.appendChild(li);
  });
  langBtn.textContent = t('langButton');
  setStatus(statusKey);
  showTransport();
  updateButtons();
  updateLagUI();
  renderNowPlaying();
}

langBtn.addEventListener('click', () => {
  lang = (lang === 'ko') ? 'en' : 'ko';
  try { localStorage.setItem('lang', lang); } catch (e) {}
  applyLanguage();
});

applyLanguage();
</script>
</body>
</html>
